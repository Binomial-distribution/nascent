name: nascent_app
description: Nascent 控制端（Android 优先）
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

# 通用能力一律用 pub.dev 上的成熟包，自己只写产品逻辑。
# Dart 侧不做 vendored：pub 有 pubspec.lock 锁定版本，
# 且 .pub-cache 与仓库分离，拷源码进来反而破坏工具链。
dependencies:
  flutter:
    sdk: flutter

  # BLE。选 flutter_reactive_ble 而不是 flutter_blue_plus：
  # 前者的连接状态是流式的，断连重连逻辑不用自己写状态机。
  flutter_reactive_ble: ^5.3.1

  # Android 12+ 的 BLUETOOTH_SCAN / CONNECT 运行时权限
  permission_handler: ^11.3.1

  # 状态管理
  flutter_riverpod: ^2.5.1

  # 云端 HTTPS
  dio: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
