<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nascent Love · 扫码进入</title>
  <style>
    :root {
      --bg: #16121c;
      --coral: #f4a7b9;
      --fog: #9b8aa6;
      --paper: #fff8f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--paper);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .card {
      width: min(92vw, 420px);
      padding: 28px 24px 32px;
      text-align: center;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--coral);
    }
    .hint {
      margin: 0 0 20px;
      color: var(--fog);
      font-size: 0.95rem;
    }
    img {
      width: 100%;
      max-width: 360px;
      background: #fff;
      border-radius: 20px;
      padding: 18px;
    }
    .url {
      margin: 18px 0 0;
      color: var(--coral);
      font-size: 0.92rem;
      word-break: break-all;
    }
    .url a { color: inherit; }
    @media print {
      body { background: #fff; color: #16121c; }
      h1, .url { color: #16121c; }
      .hint { color: #5c5466; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Nascent Love</h1>
    <p class="hint">用手机扫码进入网站</p>
    <img src="icons/qr-love.png" width="800" height="800" alt="扫码进入 https://nlove.divesee.com">
    <p class="url"><a href="https://nlove.divesee.com">https://nlove.divesee.com</a></p>
  </main>
</body>
</html>
