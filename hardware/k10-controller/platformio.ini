; k10-controller —— UNIHIKER K10（ESP32-S3）
;
; 本配置以 DFRobot 官方示例 platform-unihiker/examples/unihiker-accelerate-ball
; 的 platformio.ini 为基底，只删掉了 TFLite（本项目不跑模型）并补了协议头路径。
;
; platform 直接指向 DFRobot 的 GitHub 仓库：它包含板定义、Arduino 内核
; （含 unihiker_k10 屏幕/按键/RGB 库、BLEDevice、esp_now），首次构建时自动拉取。
; 这部分是工具链不是库，没法 vendored，也不需要。
; 需要 vendored 的第三方库只有 ArduinoJson，已在 lib/ 下，见 ../VENDOR.md。

[env:k10-controller]
platform = https://github.com/DFRobot/platform-unihiker.git
board = unihiker_k10
framework = arduino

board_build.partitions = large_spiffs_16MB.csv

monitor_speed = 115200
upload_speed = 460800

; 官方内核默认 gnu++11，但协议头和本工程用了 C++17
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -I$PROJECT_DIR/../../protocol/generated
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    ; unihiker_k10 内核要求定义 Model；本工程不跑 AI 模型
    -DModel=None
    -DCORE_DEBUG_LEVEL=3

lib_ldf_mode = deep+
