; toy-sidecar —— 玩具侧 ESP32-S3-N16R8
;
; 传感（DHT11 / MPU6050 / FSR402）、灯效（WS2812B x8）、
; 以及通过 CD4066 并联原产品按键。永远不直接驱动电机。
;
; 通用驱动全部用社区成熟库，源码 vendored 在 lib/ 下，
; PlatformIO 自动识别，无需 lib_deps。版本与来源见 ../VENDOR.md。
; 本工程自己写的只有产品独有逻辑：入体推断、灯语、CD4066 时序、板间协议。

[env:toy-sidecar]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi   ; N16R8: 16MB flash + 8MB PSRAM

build_flags =
    -I$PROJECT_DIR/../../protocol/generated
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=3
    ; CD4066 供电方案标记（源码不引用，只用于追溯硬件决策）。
    ; 2026-08-28 实测：关机态按键两端约 3.7V，超过 3.3V，
    ; 情况 A 否决，走情况 B —— CD4066 由原板电池 3.8V 供电。
    ; 详见 README 的「CD4066 供电已定案」一节。
    -DNL_CD4066_CASE_A_3V3=0

; MPU6050 内含 I2Cdev，需要 LDF 多走一层才能解出 Wire 依赖
lib_ldf_mode = deep+
