; toy-sidecar —— 玩具侧 ESP32-S3-N16R8，0.3.0 起是整个 demo 唯一一块板
;
; 传感（DHT11 / MPU6050 / FSR402）、灯效（WS2812B x8）、
; 通过 AO3400A 低边 N-MOS 并联原产品按键，以及手机直连用的 BLE GATT 外设。
; 永远不直接驱动电机。
;
; 通用驱动全部用社区成熟库，源码 vendored 在 lib/ 下，
; PlatformIO 自动识别，无需 lib_deps。版本与来源见 ../VENDOR.md。
; 本工程自己写的只有产品独有逻辑：入体推断、灯语、原按键时序、传输与安全总督。

[env:toy-sidecar]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi   ; N16R8: 16MB flash + 8MB PSRAM

; 默认分区给 app 约 1.28MB，装不下 Bluedroid BLE + WiFi + 传感器这一套。
; 板上是 16MB flash，huge_app 给到约 3MB，余量充足。
; 改这一行会让已烧录的板子分区布局变化，必须整片重烧，不能只 OTA。
board_build.partitions = huge_app.csv

build_flags =
    -I$PROJECT_DIR/../../protocol/generated
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=3
    ; 原按键开关器件标记（源码不引用，只用于追溯硬件决策）。
    ; 2026-08-28 实测：关机态按键两端约 3.7V，高于 3.3V。CD4066 会经输入
    ; 保护二极管往 ESP32 的 3V3 轨倒灌，抬到 3.8V/5V 供电又要额外供电轨与
    ; 控制端电平转换，因此整条 CD4066 路线（原「情况 A/B」）作废，
    ; 改用 AO3400A 低边 N-MOS：源极即地，无供电轨、无倒灌路径。
    ; 漏极串 10kΩ 把支路电流封在 0.37mA，详见 README 的「原按键开关器件」一节。
    -DNL_BTN_SWITCH_AO3400=1

; MPU6050 内含 I2Cdev，需要 LDF 多走一层才能解出 Wire 依赖
lib_ldf_mode = deep+
